<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1024px;
    height: 1024px;
    overflow: hidden;
    background: #0f172a;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar-box {
    position: relative;
    width: 1024px;
    height: 1024px;
    /* Deep Indigo to Vibrant Tech Cyan Gradient */
    background: radial-gradient(circle at 50% 40%, #1e3a8a 0%, #0f172a 68%, #030712 100%);
    overflow: hidden;
  }

  /* Starfield Background Glow */
  .glow-center {
    position: absolute;
    top: 200px;
    left: 200px;
    width: 624px;
    height: 624px;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.35) 0%, rgba(3, 105, 161, 0.15) 50%, transparent 70%);
    filter: blur(50px);
  }

  /* Safe circular guide subtle border */
  .safe-ring {
    position: absolute;
    top: 32px;
    left: 32px;
    width: 960px;
    height: 960px;
    border-radius: 50%;
    border: 2px dashed rgba(56, 189, 248, 0.12);
  }

  /* SVG Container */
  .svg-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 1024px;
    height: 1024px;
  }
</style>
</head>
<body>

<div class="avatar-box">
  <div class="glow-center"></div>
  <div class="safe-ring"></div>

  <svg class="svg-layer" viewBox="0 0 1024 1024" fill="none">
    <defs>
      <!-- "36" Metallic Chrome Glow Gradient -->
      <linearGradient id="numGrad" x1="220" y1="280" x2="800" y2="780" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="45%" stop-color="#F0F9FF" />
        <stop offset="75%" stop-color="#7DD3FC" />
        <stop offset="100%" stop-color="#0284C7" />
      </linearGradient>

      <!-- Polaris Guiding Star Glow -->
      <linearGradient id="goldStar" x1="680" y1="140" x2="860" y2="340" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FEF08A" />
        <stop offset="50%" stop-color="#FBBF24" />
        <stop offset="100%" stop-color="#38BDF8" />
      </linearGradient>

      <linearGradient id="orbitGrad" x1="180" y1="680" x2="840" y2="360" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2"/>
        <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#BAE6FD" stop-opacity="1"/>
      </linearGradient>

      <!-- Drop Shadow for 36 -->
      <filter id="shadow36" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284C7" flood-opacity="0.45"/>
      </filter>
    </defs>

    <!-- Background Cosmic Orbit Rings -->
    <path d="M160 680 C260 380, 580 240, 860 340" stroke="url(#orbitGrad)" stroke-width="22" stroke-linecap="round" stroke-dasharray="28 44" opacity="0.85" filter="url(#shadow36)"/>
    <circle cx="860" cy="340" r="16" fill="#FDE047" filter="url(#shadow36)"/>

    <!-- Inner Secondary Satellite Orbit -->
    <path d="M240 760 C380 840, 680 820, 820 680" stroke="#0284C7" stroke-width="8" stroke-dasharray="14 20" opacity="0.4"/>

    <!-- Main "36" Brand Mark -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="950" font-style="italic" filter="url(#shadow36)">
      <!-- Number 3 -->
      <path d="M230 330 H430 C455 330 470 350 460 375 L410 445 C440 445 470 465 470 505 C470 580 400 620 320 620 C270 620 235 595 225 570 L285 530 C295 545 310 555 330 555 C365 555 395 535 395 500 C395 470 370 450 335 450 H290 L330 395 H230 V330 Z" fill="url(#numGrad)" />
      
      <!-- Number 6 -->
      <path d="M560 330 H730 V395 H625 L590 475 C610 455 645 445 680 445 C755 445 810 500 810 575 C810 660 745 725 660 725 C570 725 510 650 510 540 C510 430 545 330 560 330 Z M645 660 C695 660 735 620 735 575 C735 530 695 505 655 505 C620 505 585 530 585 575 C585 620 620 660 645 660 Z" fill="url(#numGrad)" />
    </g>

    <!-- Polaris Guiding Star (Exploring World) -->
    <g transform="translate(710, 150)">
      <path d="M60 0 L72 38 L110 50 L72 62 L60 100 L48 62 L10 50 L48 38 Z" fill="url(#goldStar)" filter="url(#shadow36)"/>
      <circle cx="60" cy="50" r="8" fill="#FFFFFF"/>
    </g>

    <!-- Starfield Sparkles -->
    <circle cx="280" cy="220" r="10" fill="#BAE6FD" opacity="0.8"/>
    <circle cx="380" cy="170" r="6" fill="#FDE047" opacity="0.9"/>
    <circle cx="830" cy="740" r="9" fill="#38BDF8" opacity="0.7"/>

    <!-- Bottom Brand Monogram Text "36XT" -->
    <text x="512" y="855" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="78" font-weight="950" letter-spacing="22" fill="#E0F2FE" opacity="0.95">
      36XT
    </text>

    <!-- Slogan Dot -->
    <text x="512" y="915" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#38BDF8" opacity="0.75">
      EXPLORE THE WORLD
    </text>
  </svg>
</div>

</body>
</html>
